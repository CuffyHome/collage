<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Studio | สร้างภาพคอลลาจหลายรูปแบบ (2-12 รูป)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
                        Collage Studio
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">รวมภาพความทรงจำ 2 - 12 ช่องให้เป็นหนึ่งเดียว</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btn-upload-bulk" class="px-3 sm:px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition flex items-center gap-2 border border-slate-700 cursor-pointer">
                    <i data-lucide="images" class="w-4 h-4 text-indigo-400"></i>
                    <span id="bulk-btn-text" class="hidden sm:inline">อัปโหลดทีเดียว 8 รูป</span>
                    <span class="sm:hidden">เลือกหลายรูป</span>
                </button>
                <button id="btn-download" class="px-4 sm:px-5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition flex items-center gap-2 cursor-pointer">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>บันทึกรูปภาพ</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hidden File Inputs -->
    <input type="file" id="bulk-file-input" accept="image/*" multiple class="hidden">
    <input type="file" id="single-file-input" accept="image/*" class="hidden">

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 flex flex-col lg:flex-row gap-6 lg:gap-8">
        
        <!-- Left/Top: Controls Sidebar -->
        <aside class="w-full lg:w-80 flex-shrink-0 flex flex-col gap-5 order-2 lg:order-1">
            
            <!-- Photo Count Selector Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i>
                    จำนวนรูปภาพ
                </h2>
                <div class="grid grid-cols-5 gap-2" id="count-options">
                    <button data-count="2" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">2 รูป</button>
                    <button data-count="3" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">3 รูป</button>
                    <button data-count="4" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">4 รูป</button>
                    <button data-count="5" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">5 รูป</button>
                    <button data-count="6" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">6 รูป</button>
                    <button data-count="7" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">7 รูป</button>
                    <button data-count="8" class="count-btn py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition cursor-pointer">8 รูป</button>
                    <button data-count="10" class="count-btn py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">10 รูป</button>
                    <button data-count="12" class="count-btn col-span-2 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">12 รูป</button>
                </div>
            </div>

            <!-- Layout Presets Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="grid" class="w-4 h-4 text-indigo-400"></i>
                    <span id="layout-section-title">รูปแบบการจัดวาง (8 ช่อง)</span>
                </h2>
                <div class="grid grid-cols-2 gap-2.5" id="layout-options">
                    <!-- Dynamic layout buttons will be rendered here -->
                </div>
            </div>

            <!-- Styling Controls Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
                    ปรับแต่งกรอบและสีพื้นหลัง
                </h2>

                <!-- Aspect Ratio -->
                <div>
                    <label class="text-xs text-slate-400 block mb-2">สัดส่วนภาพ (Aspect Ratio)</label>
                    <div class="grid grid-cols-3 gap-2" id="ratio-options">
                        <button data-ratio="1:1" class="ratio-btn py-2 px-3 rounded-xl text-xs font-medium bg-indigo-600 text-white transition cursor-pointer">1:1 จัตุรัส</button>
                        <button data-ratio="4:5" class="ratio-btn py-2 px-3 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">4:5 โพสต์ IG</button>
                        <button data-ratio="16:9" class="ratio-btn py-2 px-3 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">16:9 แนวนอน</button>
                    </div>
                </div>

                <!-- Gap / Spacing Slider -->
                <div>
                    <div class="flex justify-between text-xs mb-1.5">
                        <span class="text-slate-400">ระยะห่างช่องไฟ (Gap)</span>
                        <span id="gap-value" class="text-indigo-400 font-medium">16 px</span>
                    </div>
                    <input type="range" id="gap-slider" min="0" max="48" value="16" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <!-- Border Radius Slider -->
                <div>
                    <div class="flex justify-between text-xs mb-1.5">
                        <span class="text-slate-400">ความโค้งมุมรูป (Radius)</span>
                        <span id="radius-value" class="text-indigo-400 font-medium">16 px</span>
                    </div>
                    <input type="range" id="radius-slider" min="0" max="40" value="16" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <!-- Background Color Picker -->
                <div>
                    <label class="text-xs text-slate-400 block mb-2">สีพื้นหลัง / สีเส้นขอบ</label>
                    <div class="flex items-center gap-2 flex-wrap">
                        <button data-color="#ffffff" class="color-swatch w-7 h-7 rounded-full bg-white border-2 border-indigo-500 shadow-sm cursor-pointer" title="สีขาว"></button>
                        <button data-color="#0f172a" class="color-swatch w-7 h-7 rounded-full bg-slate-900 border border-slate-700 cursor-pointer" title="สีดำเข้ม"></button>
                        <button data-color="#f8fafc" class="color-swatch w-7 h-7 rounded-full bg-slate-50 border border-slate-300 cursor-pointer" title="สีควันบุหรี่"></button>
                        <button data-color="#fef2f2" class="color-swatch w-7 h-7 rounded-full bg-rose-50 border border-rose-200 cursor-pointer" title="ชมพูพาสเทล"></button>
                        <button data-color="#f0fdf4" class="color-swatch w-7 h-7 rounded-full bg-emerald-50 border border-emerald-200 cursor-pointer" title="เขียวมิ้นต์"></button>
                        <button data-color="#fefce8" class="color-swatch w-7 h-7 rounded-full bg-amber-50 border border-amber-200 cursor-pointer" title="ครีมอบอุ่น"></button>
                        <label class="w-7 h-7 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 flex items-center justify-center cursor-pointer overflow-hidden border border-slate-600" title="เลือกสีเอง">
                            <input type="color" id="custom-color-picker" value="#ffffff" class="opacity-0 w-10 h-10 cursor-pointer">
                        </label>
                    </div>
                </div>

                <!-- Action Utilities -->
                <div class="pt-2 border-t border-slate-800 flex gap-2">
                    <button id="btn-sample" class="flex-1 py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition flex items-center justify-center gap-1.5 cursor-pointer">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                        สุ่มภาพตัวอย่าง
                    </button>
                    <button id="btn-clear" class="py-2 px-3 rounded-xl bg-slate-800 hover:bg-rose-950/60 hover:text-rose-400 text-xs font-medium text-slate-400 transition flex items-center justify-center gap-1.5 cursor-pointer" title="ล้างรูปทั้งหมด">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Center/Right: Interactive Collage Preview Workspace -->
        <section class="flex-1 flex flex-col items-center justify-center bg-slate-900/50 border border-slate-800/80 rounded-3xl p-4 sm:p-8 min-h-[450px] order-1 lg:order-2 relative overflow-hidden">
            
            <!-- Helper Instruction Banner -->
            <div class="mb-4 text-center flex flex-wrap items-center justify-center gap-2 text-xs text-slate-400 bg-slate-900/90 px-4 py-2 rounded-full border border-slate-800">
                <span class="flex items-center gap-1"><i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5 text-indigo-400"></i> คลิกที่ช่องเพื่อเพิ่ม/เปลี่ยนรูป</span>
                <span class="hidden sm:inline text-slate-600">•</span>
                <span class="flex items-center gap-1"><i data-lucide="move" class="w-3.5 h-3.5 text-purple-400"></i> ลากสลับตำแหน่งระหว่างช่องได้</span>
            </div>

            <!-- The Collage Board (HTML Interactive Preview) -->
            <div class="w-full flex items-center justify-center flex-1">
                <div id="collage-board" 
                     class="w-full max-w-[560px] aspect-square bg-white shadow-2xl transition-all duration-200 grid overflow-hidden select-none"
                     style="padding: 16px; gap: 16px; border-radius: 12px;">
                    <!-- 8 Cells will be injected dynamically by JS -->
                </div>
            </div>

        </section>
    </main>

    <!-- Toast Notification Container (Replaces alert) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Hidden High-Res Canvas for Exporting Image -->
    <canvas id="export-canvas" class="hidden"></canvas>

        // Render the Interactive Board
        function renderBoard() {
            const layoutConfig = LAYOUTS_BY_COUNT[state.photoCount][state.layoutIndex];

            // Apply Aspect Ratio & Sizing to Board
            boardEl.classList.remove('aspect-square', 'aspect-[4/5]', 'aspect-video', 'max-w-[560px]', 'max-w-[460px]', 'max-w-[680px]');
            if (state.ratio === '1:1') {
                boardEl.classList.add('aspect-square', 'max-w-[560px]');
            } else if (state.ratio === '4:5') {
                boardEl.classList.add('aspect-[4/5]', 'max-w-[460px]');
            } else if (state.ratio === '16:9') {
                boardEl.classList.add('aspect-video', 'max-w-[680px]');
            }

            // Apply Grid Columns/Rows, Gap, Padding, Background
            boardEl.style.gridTemplateColumns = `repeat(${layoutConfig.cols}, minmax(0, 1fr))`;
            boardEl.style.gridTemplateRows = `repeat(${layoutConfig.rows}, minmax(0, 1fr))`;
            boardEl.style.gap = `${state.gap}px`;
            boardEl.style.padding = `${state.gap}px`;
            boardEl.style.backgroundColor = state.bgColor;

            // Clear & Rebuild Active Slots
            boardEl.innerHTML = '';

            for (let i = 0; i < state.photoCount; i++) {
                const cellDef = layoutConfig.cells[i];
                const slot = document.createElement('div');
                
                slot.style.gridColumn = `${cellDef.c} / span ${cellDef.cs}`;
                slot.style.gridRow = `${cellDef.r} / span ${cellDef.rs}`;
                slot.style.borderRadius = `${state.radius}px`;
                
                slot.className = 'relative overflow-hidden group cursor-pointer transition-all duration-200 flex items-center justify-center bg-slate-200/80 hover:ring-2 hover:ring-indigo-500';
                slot.setAttribute('draggable', state.imageUrls[i] ? 'true' : 'false');
                slot.dataset.index = i;

                // If image exists in this slot
                if (state.imageUrls[i]) {
                    const img = document.createElement('img');
                    img.src = state.imageUrls[i];
                    img.className = 'w-full h-full object-cover pointer-events-none select-none';
                    slot.appendChild(img);

                    // Hover Overlay Controls
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2';
                    overlay.innerHTML = `
                        <span class="px-2.5 py-1 bg-white/90 text-slate-900 rounded-lg text-xs font-semibold shadow">เปลี่ยนรูป</span>
                        <button type="button" class="remove-slot-btn p-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg shadow" title="ลบรูปนี้">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    `;
                    slot.appendChild(overlay);

                    // Remove single image button handler
                    overlay.querySelector('.remove-slot-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        state.images[i] = null;
                        state.imageUrls[i] = null;
                        renderBoard();
                    });
                } else {
                    // Empty Slot Placeholder
                    slot.innerHTML = `
                        <div class="flex flex-col items-center justify-center text-slate-500 group-hover:text-indigo-600 transition-colors p-2 text-center">
                            <div class="w-8 h-8 rounded-full bg-white/80 shadow-sm flex items-center justify-center mb-1">
                                <span class="text-sm font-bold">+</span>
                            </div>
                            <span class="text-[11px] font-medium">รูปที่ ${i + 1}</span>
                        </div>
                    `;
                }

                // Click to upload single image
                slot.addEventListener('click', () => {
                    state.activeSlotIndex = i;
                    singleInput.click();
                });

                // Drag & Drop to swap images between slots
                slot.addEventListener('dragstart', (e) => {
                    state.draggedSlotIndex = i;
                    slot.classList.add('opacity-50');
                });

                slot.addEventListener('dragend', () => {
                    slot.classList.remove('opacity-50');
                    state.draggedSlotIndex = null;
                });

                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    slot.classList.add('ring-2', 'ring-purple-500');
                });

                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('ring-2', 'ring-purple-500');
                });

                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('ring-2', 'ring-purple-500');
                    
                    // Handle external file drop directly onto a slot
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        loadImageToSlot(e.dataTransfer.files[0], i);
                        return;
                    }

                    // Handle swapping two slots
                    const fromIdx = state.draggedSlotIndex;
                    const toIdx = i;
                    if (fromIdx !== null && fromIdx !== toIdx) {
                        [state.images[fromIdx], state.images[toIdx]] = [state.images[toIdx], state.images[fromIdx]];
                        [state.imageUrls[fromIdx], state.imageUrls[toIdx]] = [state.imageUrls[toIdx], state.imageUrls[fromIdx]];
                        renderBoard();
                        showToast('สลับตำแหน่งรูปภาพแล้ว', 'info');
                    }
                });

                boardEl.appendChild(slot);
            }
        }

                const img = new Image();
                img.onload = () => {
                    state.images[index] = img;
                    state.imageUrls[index] = e.target.result;
                    renderBoard();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Helper: Draw Rounded Rectangle Path on Canvas
        function roundRectPath(ctx, x, y, width, height, radius) {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + width, y, x + width, y + height, r);
            ctx.arcTo(x + width, y + height, x, y + height, r);
            ctx.arcTo(x, y + height, x, y, r);
            ctx.arcTo(x, y, x + width, y, r);
            ctx.closePath();
        }

        // Helper: Draw Image with "object-fit: cover" behavior on Canvas
        function drawImageCover(ctx, img, x, y, w, h) {
            const imgRatio = img.width / img.height;
            const boxRatio = w / h;
            let sx, sy, sw, sh;

            if (imgRatio > boxRatio) {
                sh = img.height;
                sw = img.height * boxRatio;
                sx = (img.width - sw) / 2;
                sy = 0;
            } else {
                sw = img.width;
                sh = img.width / boxRatio;
                sx = 0;
                sy = (img.height - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }

        // Export High-Resolution Single Image (PNG)
        document.getElementById('btn-download').addEventListener('click', () => {
            const activeImages = state.images.slice(0, state.photoCount);
            const hasAnyImage = activeImages.some(img => img !== null);
            if (!hasAnyImage) {
                showToast('กรุณาเพิ่มรูปภาพอย่างน้อย 1 รูปก่อนบันทึกครับ', 'warning');
                return;
            }

            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');

            // High-Res Export Dimensions
            let exportW = 2000;
            let exportH = 2000;
            if (state.ratio === '4:5') {
                exportW = 1800;
                exportH = 2250;
            } else if (state.ratio === '16:9') {
                exportW = 2400;
                exportH = 1350;
            }

            canvas.width = exportW;
            canvas.height = exportH;

            // Scale factor relative to preview board (~560px)
            const scale = exportW / 560;
            const gap = state.gap * scale;
            const radius = state.radius * scale;

            // Fill Background
            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, exportW, exportH);

            const layoutConfig = LAYOUTS_BY_COUNT[state.photoCount][state.layoutIndex];
            const cols = layoutConfig.cols;
            const rows = layoutConfig.rows;

            const innerW = exportW - gap * 2;
            const innerH = exportH - gap * 2;
            const cellW = (innerW - gap * (cols - 1)) / cols;
            const cellH = (innerH - gap * (rows - 1)) / rows;

            // Draw each active cell
            for (let i = 0; i < state.photoCount; i++) {
                const cell = layoutConfig.cells[i];
                const x = gap + (cell.c - 1) * (cellW + gap);
                const y = gap + (cell.r - 1) * (cellH + gap);
                const w = cell.cs * cellW + (cell.cs - 1) * gap;
                const h = cell.rs * cellH + (cell.rs - 1) * gap;

                ctx.save();
                roundRectPath(ctx, x, y, w, h, radius);
                ctx.clip();

                if (state.images[i]) {
                    drawImageCover(ctx, state.images[i], x, y, w, h);
                } else {
                    // Empty slot subtle fill on export
                    ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
                    ctx.fillRect(x, y, w, h);
                }
                ctx.restore();
            }

            // Trigger Download
            const link = document.createElement('a');
            link.download = `collage-${state.photoCount}photos-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();

            showToast(`บันทึกภาพคอลลาจ ${state.photoCount} ช่องสำเร็จ!`, 'success');
        });

        // Initial Setup
        renderLayoutOptions();
        loadSampleImages();
    </script>
</body>
</html>
